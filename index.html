<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patricia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    main {
      max-width: 34rem;
      text-align: center;
    }
    img {
      width: 12rem;
      height: 12rem;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #f5f5f5;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #bdbdbd;
      margin-bottom: 1rem;
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid #f5f5f5;
      border-radius: 999px;
      color: #f5f5f5;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    a:hover, a:focus-visible { background: #f5f5f5; color: #0a0a0a; }
  </style>
</head>
<body>
  <main>
    <img src="profilepic.jpeg" alt="Photo of Patricia">
    <h1>Hi, my name is Patricia.</h1>
    <p>I'm a designer learning to build with Claude Code.</p>
    <p>My favorite color is black.</p>
    <a href="https://linkedin.com/in/patriciarocha-br" target="_blank" rel="noopener">Find me on LinkedIn</a>
  </main>
</body>
</html>
